name: CI

# Offline checks only: no credentials in this workflow. The SDKs and their tests are in
# boxfab/python-sdk and boxfab/js-sdk (desktop/).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  template:
    # The template definition must render with the BoxFab SDK (no build, no credentials).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: cd template && uv sync && uv run python build_docker.py > /tmp/Dockerfile && grep -q '^FROM ubuntu:22.04' /tmp/Dockerfile

  generated-code-is-in-sync:
    # Generated paths must be exactly what scripts/sync_upstream.py produces from the pins.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/sync_upstream.py
      - run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

  examples:
    # The Python example must at least compile; it needs keys to run (see its README).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m py_compile examples/computer-use-claude-python/main.py
