[project]
name = "boxfab-desktop"
version = "0.1.0a1"
description = "BoxFab Desktop: a virtual Linux desktop in a BoxFab sandbox, for computer-use agents"
authors = [{ name = "ContextFab, Inc." }]
license = "MIT"
license-files = ["LICENSE", "LICENSE-E2B"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Upstream e2b-desktop 2.7.2 depends on e2b>=2.44.0; boxfab 0.1.0a2 is built from e2b 2.62.0,
# the monorepo commit this package is generated from. The other ranges are upstream's.
dependencies = [
    "boxfab>=0.1.0a2,<0.2",
    "requests>=2.32.3,<3",
    "urllib3>=2.8.0,<3",
    "pillow>=13.0.0,<14",
]

[project.urls]
Repository = "https://github.com/boxfab/desktop"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-xdist>=3.6.1,<4",
    "ruff>=0.11.12,<0.12",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["boxfab_desktop"]
module-root = ""
source-exclude = ["tests"]

[tool.ruff.lint]
ignore = ["F401", "F403"]
